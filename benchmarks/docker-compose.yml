version: "3.9"

# Benchmark competitors — run independently of the main ScyllaVec stack.
#
# Start:   docker compose -f benchmarks/docker-compose.yml up -d
# Stop:    docker compose -f benchmarks/docker-compose.yml down -v

services:

  # ── pgvector (Postgres 16 + pgvector extension) ────────────────────────────
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: bench-pgvector
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Chroma ─────────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: bench-chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Weaviate ───────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: bench-weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 100
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes: {}
