version: "3.9"

services:
  scylla:
    image: scylladb/scylla:5.4
    container_name: scyllavec-scylla
    command: --smp 2 --memory 1G --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042"   # CQL
      - "9180:9180"   # Prometheus metrics
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Sidecar shards ────────────────────────────────────────────────────────
  # Two sidecar instances share the same ScyllaDB backend.
  # Each holds half the in-memory HNSW index (routed by hash(vector_id) % 2).
  # Scale horizontally by adding more shards and updating SIDECAR_URLS in api.

  sidecar-0:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: scyllavec-sidecar-0
    environment:
      SCYLLA_HOSTS: scylla:9042
      SCYLLA_KEYSPACE: scyllavec
      SIDECAR_GRPC_PORT: "50051"
      RUST_LOG: info
    ports:
      - "50051:50051"
    depends_on:
      scylla:
        condition: service_healthy
    restart: on-failure

  sidecar-1:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: scyllavec-sidecar-1
    environment:
      SCYLLA_HOSTS: scylla:9042
      SCYLLA_KEYSPACE: scyllavec
      SIDECAR_GRPC_PORT: "50051"
      RUST_LOG: info
    ports:
      - "50052:50051"
    depends_on:
      scylla:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: scyllavec-api
    environment:
      SCYLLA_HOSTS: scylla:9042
      SCYLLA_KEYSPACE: scyllavec
      # Comma-separated list of all sidecar shards
      SIDECAR_URLS: sidecar-0:50051,sidecar-1:50051
      API_PORT: "8000"
      # Uncomment and set to enable API key auth on all endpoints except /health
      # API_KEY: "changeme"
    ports:
      - "8000:8000"    # REST API
    depends_on:
      scylla:
        condition: service_healthy
    restart: on-failure

volumes:
  scylla-data:
