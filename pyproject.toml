[project]
name = "scyllavec"
version = "0.1.0"
description = "Vector store built on ScyllaDB"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "cassandra-driver>=3.29",       # ScyllaDB-compatible CQL driver
    "grpcio>=1.63",
    "grpcio-tools>=1.63",
    "protobuf>=4.25",
    "pydantic>=2.7",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",                  # async test client for FastAPI
    "sentence-transformers>=2.7",   # local embeddings for tests/seeds
]
langchain = [
    "langchain-core>=0.2",
]
llamaindex = [
    "llama-index-core>=0.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["sdk/scyllavec"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
